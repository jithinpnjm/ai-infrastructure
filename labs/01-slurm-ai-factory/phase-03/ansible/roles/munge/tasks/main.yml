---
- name: Install MUNGE
  ansible.builtin.apt:
    name: "{{ munge_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check that the controller-side MUNGE key exists
  ansible.builtin.stat:
    path: "{{ munge_key_source }}"
  delegate_to: localhost
  become: false
  register: munge_key_source_stat

- name: Require controller-side MUNGE key
  ansible.builtin.assert:
    that:
      - munge_key_source_stat.stat.exists
      - munge_key_source_stat.stat.isreg
    fail_msg: >-
      MUNGE key is missing from {{ munge_key_source }}. The key must be
      supplied out-of-band and must never be committed to Git.

- name: Install cluster MUNGE key
  ansible.builtin.copy:
    src: "{{ munge_key_source }}"
    dest: "{{ munge_key_destination }}"
    owner: munge
    group: munge
    mode: '0400'
  notify: Restart MUNGE

- name: Ensure MUNGE service is enabled and running
  ansible.builtin.service:
    name: "{{ munge_service_name }}"
    enabled: true
    state: started

- name: Validate MUNGE locally
  ansible.builtin.shell: munge -n | unmunge
  args:
    executable: /bin/bash
  register: munge_validation
  changed_when: false

- name: Require successful MUNGE decode
  ansible.builtin.assert:
    that:
      - munge_validation.rc == 0
      - "'STATUS:          Success (0)' in munge_validation.stdout"
    fail_msg: MUNGE encode/decode validation failed.
