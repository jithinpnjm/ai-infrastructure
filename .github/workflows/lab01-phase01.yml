name: Lab 01 - Phase 01 - Infrastructure Foundation

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Infrastructure action"
        required: true
        type: choice
        options:
          - validate-credentials
          - plan
          - apply
          - validate
          - destroy
        default: validate-credentials

permissions:
  contents: read

jobs:
  phase01:
    runs-on: ubuntu-latest
    environment: nebius-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        env:
          NEBIUS_SA_ID: ${{ secrets.NEBIUS_SA_ID }}
          NEBIUS_AUTHKEY_ID: ${{ secrets.NEBIUS_AUTHKEY_ID }}
          NEBIUS_AUTHKEY_PRIVATE_KEY: ${{ secrets.NEBIUS_AUTHKEY_PRIVATE_KEY }}
          NEBIUS_PROJECT_ID: ${{ vars.NEBIUS_PROJECT_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEBIUS_SA_ID" || { echo "Missing NEBIUS_SA_ID"; exit 1; }
          test -n "$NEBIUS_AUTHKEY_ID" || { echo "Missing NEBIUS_AUTHKEY_ID"; exit 1; }
          test -n "$NEBIUS_AUTHKEY_PRIVATE_KEY" || { echo "Missing NEBIUS_AUTHKEY_PRIVATE_KEY"; exit 1; }
          test -n "$NEBIUS_PROJECT_ID" || { echo "Missing NEBIUS_PROJECT_ID environment variable"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY"; exit 1; }
          printf '%s\n' "$NEBIUS_AUTHKEY_PRIVATE_KEY" | grep -q -- 'BEGIN .*PRIVATE KEY' || { echo "NEBIUS_AUTHKEY_PRIVATE_KEY does not look like a PEM private key"; exit 1; }
          printf '%s\n' "$SSH_PRIVATE_KEY" | grep -q -- 'BEGIN OPENSSH PRIVATE KEY' || { echo "SSH_PRIVATE_KEY does not look like an OpenSSH private key"; exit 1; }
          echo "Required configuration is present and key formats look valid. Secret values were not printed."

      - name: Explain selected action
        run: |
          echo "Selected action: ${{ inputs.action }}"
          echo "Terraform/Ansible provisioning remains disabled until the manual Phase 01 build is completed and validated."
